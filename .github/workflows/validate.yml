name: validate

on:
  push:
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use placeholder env
        run: cp .env.example .env

      - name: Syntax and schema check
        run: docker compose config

      - name: Dry-run verification
        run: docker compose up --dry-run
