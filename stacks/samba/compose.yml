services:
  samba:
    extends:
      file: ${TEMPLATES_PATH}
      service: default
    image: dockurr/samba
    container_name: samba
    environment:
      NAME: ${NAME}
      USER: ${USER}
      PASS: ${PASS}
    ports:
      - 445:445
    volumes:
      - /mnt/data:/storage
    restart: always
